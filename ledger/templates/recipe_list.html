{% extends "base.html" %}

{% block page_title %}Recipe List{% endblock %}

{% block content %}
    <ol>
        {% for recipe in recipes%}
        <li>
            <a href = "{{ recipe.get_absolute_url }}">
                {{recipe.name}}
            </a>
        </li>
        {% endfor %}
    </ol>

    <a href="{% url 'ledger:recipe_add' %}">Add New Recipe</a>
{% endblock content %}
